name: Shared KMP

on:
  pull_request:
    paths:
      - "shared/**"
      - "version.properties"
      - "packaging/version/**"
      - "packaging/android/**"
      - ".github/workflows/android-release.yml"
      - "crates/vnidrop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "androidApp/**"
      - "Makefile"
      - "config.mk"
      - "make/**"
      - ".github/workflows/shared-kmp.yml"
  push:
    branches:
      - master
    paths:
      - "shared/**"
      - "version.properties"
      - "packaging/version/**"
      - "packaging/android/**"
      - ".github/workflows/android-release.yml"
      - "crates/vnidrop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "androidApp/**"
      - "Makefile"
      - "config.mk"
      - "make/**"
      - ".github/workflows/shared-kmp.yml"

permissions:
  contents: read

concurrency:
  group: shared-kmp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jvm-test:
    # Host Rust embedding is enabled only for the current Gobley host target.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true
          add-to-path: false

      - name: Export Android NDK location
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install Linux credential service
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools

      - name: Verify bug-report build configuration
        run: python3 packaging/android/tests/test_diagnostics_config.py

      - name: Verify preview and store package identities
        run: python3 packaging/android/tests/test_preview_config.py

      - name: Run shared JVM tests
        run: make/with-secret-service.sh make check-shared

      - name: Check Android app and native libraries
        run: ./gradlew :androidApp:check --no-daemon --stacktrace
