name: Linux packages

on:
  pull_request:
    paths:
      - ".github/workflows/linux-packages.yml"
      - "linux/**"
      - "packaging/linux/**"
      - "packaging/version/**"
      - "localization/**"
      - "version.properties"
      - "assets/linux/**"
      - "crates/vnidrop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "gradle.properties"
      - "Makefile"
      - "config.mk"
      - "make/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build-deb:
    name: Build GTK Debian package (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install GTK and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config cmake clang perl \
            libgtk-4-dev libadwaita-1-dev librsvg2-common libssl-dev \
            desktop-file-utils shared-mime-info xdg-utils file

      - name: Set up Rust 1.91
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "1.91.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: linux-gtk-ubuntu

      - name: Resolve canonical version
        id: version
        run: |
          version=$(packaging/linux/resolve-version.sh)
          echo "app=$version" >> "$GITHUB_OUTPUT"

      - name: Test headless MIME verification
        run: bash linux/packaging/tests/test-verify-mime.sh

      - name: Test native Linux logic
        env:
          VNIDROP_DIAGNOSTICS_REQUIRED: '0'
          VNIDROP_DIAGNOSTICS_ENDPOINT: ''
          VNIDROP_DIAGNOSTICS_INGEST_KEY: ''
        run: cargo test --locked -p vnidrop-gnome --lib

      - name: Build and verify GTK Debian package
        env:
          VNIDROP_DIAGNOSTICS_REQUIRED: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          VNIDROP_DIAGNOSTICS_ENDPOINT: ${{ github.event_name != 'pull_request' && vars.VNIDROP_DIAGNOSTICS_ENDPOINT || '' }}
          VNIDROP_DIAGNOSTICS_INGEST_KEY: ${{ github.event_name != 'pull_request' && secrets.VNIDROP_DIAGNOSTICS_INGEST_KEY || '' }}
        run: make package-deb

      - name: Upload Debian artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vnidrop-${{ steps.version.outputs.app }}-linux-deb-x64
          path: build/release/linux/deb/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summarize Debian package
        run: |
          echo "### GTK Debian package" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version.outputs.app }}-1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Architecture: amd64" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build baseline: Ubuntu 24.04 (GTK 4.10+, libadwaita 1.5+)" >> "$GITHUB_STEP_SUMMARY"

  build-rpm:
    name: Build GTK RPM package (x64)
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:43
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Install GTK and packaging tools
        run: |
          dnf install --assumeyes git gcc gcc-c++ cmake curl pkgconf-pkg-config \
            gtk4-devel libadwaita-devel librsvg2 rpm-build desktop-file-utils \
            shared-mime-info xdg-utils file cpio make clang perl openssl-devel \
            tar gzip which

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Rust 1.91
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "1.91.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: linux-gtk-fedora-43

      - name: Resolve canonical version
        id: version
        run: |
          version=$(packaging/linux/resolve-version.sh)
          echo "app=$version" >> "$GITHUB_OUTPUT"

      - name: Test headless MIME verification
        run: bash linux/packaging/tests/test-verify-mime.sh

      - name: Build and verify GTK RPM package
        env:
          VNIDROP_DIAGNOSTICS_REQUIRED: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          VNIDROP_DIAGNOSTICS_ENDPOINT: ${{ github.event_name != 'pull_request' && vars.VNIDROP_DIAGNOSTICS_ENDPOINT || '' }}
          VNIDROP_DIAGNOSTICS_INGEST_KEY: ${{ github.event_name != 'pull_request' && secrets.VNIDROP_DIAGNOSTICS_INGEST_KEY || '' }}
        run: make package-rpm

      - name: Upload RPM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vnidrop-${{ steps.version.outputs.app }}-linux-rpm-x64
          path: build/release/linux/rpm/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summarize RPM package
        run: |
          echo "### GTK RPM package" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version.outputs.app }}-1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Architecture: x86_64" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build environment: Fedora 43" >> "$GITHUB_STEP_SUMMARY"
