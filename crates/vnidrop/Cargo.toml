[package]
name = "vnidrop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "vnidrop"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
integration-test-store = []

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
bytes = "1.12.2"
blake3 = "1.8.7"
data-encoding = "2.11.1"
futures = "0.3"
futures-lite = "2.6.1"
getrandom = "0.4.3"
iroh = "1.5.0"
iroh-blobs = "0.105.0"
irpc = "1.0.0"
libc = "0.2.191"
n0-future = "0.3.1"
num_cpus = "1.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "1.54.1", features = ["full"] }
uniffi = { version = "=0.29.4", features = ["tokio"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
walkdir = "2.5.1"
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[dev-dependencies]
iroh-relay = { version = "1.5.0", features = ["server"] }
secret-service = { version = "5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
tempfile = "3.27.0"
