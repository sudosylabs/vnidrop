name: Windows packages

on:
  pull_request:
    paths:
      - ".github/workflows/windows-store.yml"
      - "packaging/windows/**"
      - "packaging/version/**"
      - "version.properties"
      - "assets/windows/**"
      - "windows/**"
      - "localization/**"
      - "crates/vnidrop/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-msix:
    name: Build Store MSIX and direct EXE (x64)
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Verify packaging tool bootstrap
        shell: pwsh
        run: ./packaging/windows/test-packaging-tools.ps1

      - name: Verify standard-user activation launcher
        shell: powershell
        run: ./packaging/windows/test-standard-user-process.ps1

      - name: Verify MSIX activation runner policy
        shell: powershell
        run: ./packaging/windows/test-msix-runner-policy.ps1

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            build/windows/tools/uniffi
          key: windows-native-release-${{ hashFiles('Cargo.lock', 'windows/scripts/build-core.ps1') }}

      - name: Resolve canonical version
        id: version
        shell: pwsh
        run: |
          $version = .\packaging\version\resolve-version.ps1 -Field Json -VerifyTag | ConvertFrom-Json
          "app=$($version.productVersion)" >> $env:GITHUB_OUTPUT
          "package=$($version.windowsPackageVersion)" >> $env:GITHUB_OUTPUT

      - name: Test and publish native Release app
        shell: pwsh
        env:
          VNIDROP_DIAGNOSTICS_ENDPOINT: ${{ github.event_name != 'pull_request' && vars.VNIDROP_DIAGNOSTICS_ENDPOINT || '' }}
          VNIDROP_DIAGNOSTICS_INGEST_KEY: ${{ github.event_name != 'pull_request' && secrets.VNIDROP_DIAGNOSTICS_INGEST_KEY || '' }}
          VNIDROP_DIAGNOSTICS_REQUIRED: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: |
          ./windows/scripts/build.ps1 -Configuration Release -Test -Publish
          git diff --exit-code -- windows/VniDrop/Strings apple/VniDrop/Generated apple/VniDrop/Resources shared/src/commonMain/composeResources
          if ($LASTEXITCODE) { throw 'Generated localization is out of date' }

      - name: Create and validate release artifacts
        shell: pwsh
        run: |
          ./packaging/windows/build-installer.ps1 -AppImage ./build/windows/publish -OutputDirectory ./build/windows/installer
          $arguments = @{
            AppImage = "./build/windows/publish"
            DirectInstaller = "./build/windows/installer/VniDrop_${{ steps.version.outputs.app }}_x64.exe"
            OutputDirectory = ".\build\release\windows"
          }
          & .\packaging\windows\build-msix.ps1 @arguments

      - name: Verify installer payload and upgrade behavior
        shell: pwsh
        run: |
          $legacy = ./packaging/windows/get-legacy-installer.ps1
          ./packaging/windows/test-installer.ps1 -AppImage ./build/windows/publish -InstallerDirectory ./build/windows/installer -LegacyInstaller $legacy -Install

      - name: Verify packaged WinUI startup and warm notification activation
        shell: powershell
        run: ./packaging/windows/test-msix.ps1 -Package ./build/release/windows/VniDrop_${{ steps.version.outputs.app }}_x64.msix -EnableDeveloperMode

      - name: Retain Windows package failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package-failure-logs
          path: |
            build/windows/installer/test-*/*.log
            build/windows/msix-test/*/*.log
            build/windows/standard-user-test/*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vnidrop-${{ steps.version.outputs.app }}-windows-x64
          path: build/release/windows/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Summarize packages
        shell: pwsh
        run: |
          "### Windows packages" >> $env:GITHUB_STEP_SUMMARY
          "- App version: ${{ steps.version.outputs.app }}" >> $env:GITHUB_STEP_SUMMARY
          "- MSIX version: ${{ steps.version.outputs.package }}" >> $env:GITHUB_STEP_SUMMARY
          "- Architecture: x64" >> $env:GITHUB_STEP_SUMMARY
          "- Store signing: unsigned submission; Microsoft signs after certification" >> $env:GITHUB_STEP_SUMMARY
          "- Direct installer signing: unsigned; Windows SmartScreen warning expected" >> $env:GITHUB_STEP_SUMMARY
          Import-Module ./packaging/windows/Packaging.psm1 -Force
          $coldNotificationSkipReason = Get-ColdNotificationTestSkipReason
          if ($coldNotificationSkipReason) {
            "- SKIPPED: $coldNotificationSkipReason" >> $env:GITHUB_STEP_SUMMARY
          }
