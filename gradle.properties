#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.builtInKotlin=false
android.newDsl=false
android.nonTransitiveRClass=true
android.sourceset.disallowProvider=false
android.useAndroidX=true

# Bug-report delivery is enabled when endpoint and ingest key are configured.
# Keep credentials in ~/.gradle/gradle.properties or the VNIDROP_DIAGNOSTICS_ENDPOINT
# and VNIDROP_DIAGNOSTICS_INGEST_KEY environment variables.
# Explicit offline builds can pass -Pvnidrop.diagnostics.included=false.
