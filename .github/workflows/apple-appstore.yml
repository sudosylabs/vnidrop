name: Apple App Store (iOS + macOS)

# Archives the App Store targets and, when asked, uploads them to App Store
# Connect where they reach TestFlight and can be attached to a review submission.
#
# Deliberately separate from apple-release.yml (the DMG) so a build only reaches
# App Store Connect once a release has actually been published — App Store
# Connect builds cannot be deleted, only left to expire.
#
# Not Xcode Cloud, for two reasons found while trying it:
#
#  1. Xcode Cloud replaces CFBundleVersion with its own integer build-run number
#     at export and documents no way to opt out ("You can't use build numbers
#     that are hash values, timestamps, or other strings"). Our build numbers are
#     UTC timestamps shared with the direct-download channel, and macOS requires
#     build numbers to increase across versions, so an integer counter starting
#     at 1 would sort below the existing 20260802.1040.54 history.
#  2. Its cloud-managed signing emits a designated requirement encoding the
#     certificate CN in Unicode NFD while the certificate carries NFC, so the
#     signature cannot satisfy its own requirement and the upload is rejected
#     with ITMS-90035.

on:
  # TEMPORARY: workflow_dispatch only appears once this file is on the default
  # branch, so this is how the workflow gets exercised before it merges.
  # Remove before merging.
  push:
    branches: [perf/apple-pipeline]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build"
        type: choice
        default: both
        options: [both, ios, macos]
      upload:
        description: "Upload to App Store Connect (otherwise archive and export only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Keyed on the ref so a stuck run cannot block unrelated branches. Never
  # cancel in progress: a half-finished upload is worse than a duplicate build.
  group: apple-appstore-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Rust core
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.app }}
      platforms: ${{ steps.plan.outputs.platforms }}
      destination: ${{ steps.plan.outputs.destination }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          packaging/version/resolve-version.sh verify >/dev/null
          echo "app=$(packaging/version/resolve-version.sh product)" >> "$GITHUB_OUTPUT"

      - name: Plan the run
        id: plan
        # A release always builds both platforms and uploads. A dispatch follows
        # its inputs. Any other trigger (the temporary push above) gets the same
        # defaults as a dispatch — inputs.* are empty outside workflow_dispatch,
        # so they cannot be read directly without silently collapsing to nothing.
        env:
          PLATFORMS: ${{ inputs.platforms }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            platforms='["iOS","macOS"]'
            destination=upload
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            # TEMPORARY, with the push trigger above: iOS is already proven end
            # to end, so branch pushes exercise macOS only. Remove with the
            # trigger.
            platforms='["macOS"]'
            destination=upload
          else
            case "${PLATFORMS:-both}" in
              ios)   platforms='["iOS"]' ;;
              macos) platforms='["macOS"]' ;;
              *)     platforms='["iOS","macOS"]' ;;
            esac
            if [ "${UPLOAD:-true}" = false ]; then destination=export; else destination=upload; fi
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms destination=$destination"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # A published release already carries the prebuilt core as an asset, so
      # download it instead of spending ~16 minutes rebuilding what the release
      # pipeline just built. Branch dispatches have no release to draw from.
      - name: Download prebuilt core from the release
        id: prebuilt
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.app }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core"
          cd "$RUNNER_TEMP/core"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "VnidropCore-$VERSION.zip" --pattern "SHA256SUMS"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The release publishes one aggregate SHA256SUMS, not per-file digests.
          grep -F "  VnidropCore-$VERSION.zip" SHA256SUMS > core.sha256
          shasum -a 256 --check core.sha256
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.prebuilt.outputs.found != 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,aarch64-apple-ios

      - name: Cache Cargo
        if: steps.prebuilt.outputs.found != 'true'
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: apple-core-release

      - name: Build the core
        if: steps.prebuilt.outputs.found != 'true'
        # Release profile only: a debug core roughly doubles the binary. Release
        # builds skip the simulator slices, which nothing shipped can use.
        run: |
          set -euo pipefail
          make apple-core APPLE_PROFILE=release
          make package-apple-core
          mkdir -p "$RUNNER_TEMP/core"
          cp apple/dist/VnidropCore-*.zip "$RUNNER_TEMP/core/"

      - name: Share the core with the build jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vnidrop-core-${{ steps.version.outputs.app }}
          path: ${{ runner.temp }}/core/VnidropCore-*.zip
          if-no-files-found: error
          retention-days: 1

  appstore:
    name: ${{ matrix.platform }}
    needs: core
    runs-on: macos-latest
    timeout-minutes: 60
    # Gates the signing certificates behind a required reviewer, so a run started
    # by anyone else stops before it can touch them.
    environment: apple-appstore
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.core.outputs.platforms) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install tooling
        run: brew install xcodegen swiftlint

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Fetch the prebuilt core
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: vnidrop-core-${{ needs.core.outputs.version }}
          path: ${{ runner.temp }}/core

      - name: Install the core
        run: |
          set -euo pipefail
          unzip -q -o "$RUNNER_TEMP/core"/VnidropCore-*.zip -d "$RUNNER_TEMP/core/x"
          rm -rf apple/VnidropCore/vnidrop.xcframework
          cp -R "$RUNNER_TEMP/core/x/vnidrop.xcframework" apple/VnidropCore/vnidrop.xcframework
          mkdir -p apple/VnidropCore/Sources/VnidropCore
          cp "$RUNNER_TEMP/core/x/Vnidrop.swift" apple/VnidropCore/Sources/VnidropCore/Vnidrop.swift

      - name: Generate the Xcode project
        # Reuses the installed core rather than invoking apple-core.
        run: make apple-project-prebuilt

      - name: Import signing certificates
        env:
          DIST_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          DIST_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          INSTALLER_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/appstore.keychain-db"
          kpw="$(uuidgen)"
          security create-keychain -p "$kpw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpw" "$keychain"

          # Apple Distribution signs the .app. Mac Installer Distribution signs
          # the .pkg that macOS App Store submissions are wrapped in.
          # Every tool that touches these keys must be on the ACL, or it blocks
          # on a keychain prompt that a headless runner can never answer.
          # productbuild is the one that matters for macOS: xcodebuild invokes it
          # to build and sign the .pkg during export, and omitting it hung the
          # export for 9 minutes until the job was cancelled.
          tools=(-T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/security)
          echo "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$DIST_PASSWORD" "${tools[@]}"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$INSTALLER_PASSWORD" "${tools[@]}"

          # Only apple:, apple-tool: and codesign: are real partition IDs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$kpw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/installer.p12"
          security find-identity -v "$keychain"

      - name: Write App Store Connect API key
        env:
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s\n' "$APPLE_ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"

      - name: Archive
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # CODE_SIGNING_ALLOWED/REQUIRED override apple/Signing.xcconfig, which
          # pins them to NO so local and PR builds stay unsigned.
          # -allowProvisioningUpdates lets xcodebuild create and refresh the App
          # Store profiles itself, so none are stored as secrets.
          xcodebuild archive \
            -project apple/VniDrop.xcodeproj \
            -scheme VniDrop \
            -destination "generic/platform=$PLATFORM" \
            -archivePath "$RUNNER_TEMP/VniDrop.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Verify keychain access group
        # The Rust core keeps the endpoint identity in the data-protection
        # Keychain; an app resolving to no access group gets -34018 on every read
        # and dies on the startup screen. 0.3.1 shipped exactly that.
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/VniDrop.xcarchive/Products/Applications" \
            -maxdepth 1 -name '*.app' | head -1)"
          apple/scripts/verify-keychain-access-group.sh "$app"

      - name: Export
        # Always exports to disk, never uploads. Splitting export from upload
        # isolates signing failures from transport failures: a macOS upload run
        # through `destination: upload` hung indefinitely with no way to tell
        # which half was stuck.
        timeout-minutes: 20
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # manageAppVersionAndBuildNumber=false keeps our timestamp build number;
          # left true, Xcode renumbers the build on the way out.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VniDrop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        if: needs.core.outputs.destination == 'upload'
        # altool rather than `destination: upload`, because it reports progress
        # and honours a timeout. timeout-minutes fails the step loudly instead of
        # letting a stuck transport burn the whole job.
        timeout-minutes: 30
        env:
          KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # altool looks for the key by id in these well-known directories.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/asc.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"

          if [ "$PLATFORM" = iOS ]; then
            type=ios
            file="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)"
          else
            type=macos
            file="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.pkg' | head -1)"
          fi
          [ -n "$file" ] || { echo "error: no upload payload found in the export" >&2; ls -R "$RUNNER_TEMP/export" >&2; exit 1; }
          echo "==> Uploading $(basename "$file") ($type)"

          xcrun altool --upload-app --type "$type" --file "$file" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --verbose

      - name: Keep the export for inspection
        # Only when it is not already in App Store Connect: on an export-only run
        # the artifact is the deliverable, and on a failure it is the evidence.
        # After a successful upload it would just be a duplicate.
        if: needs.core.outputs.destination == 'export' || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vnidrop-${{ needs.core.outputs.version }}-${{ matrix.platform }}-appstore
          path: ${{ runner.temp }}/export
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up credentials
        if: always()
        run: |
          # The upload step copies the key into altool's search path, so remove
          # both. Hosted runners are destroyed after the job, but a self-hosted
          # one would keep $HOME.
          rm -f "$RUNNER_TEMP/asc.p8"
          rm -rf "$HOME/.appstoreconnect/private_keys"
          security delete-keychain "$RUNNER_TEMP/appstore.keychain-db" || true

      - name: Summary
        if: success()
        env:
          DESTINATION: ${{ needs.core.outputs.destination }}
        run: |
          {
            echo "### ${{ matrix.platform }} — VniDrop ${{ needs.core.outputs.version }}"
            echo
            if [ "$DESTINATION" = upload ]; then
              echo "Uploaded to App Store Connect. Processing takes a few minutes;"
              echo "the build then appears in TestFlight and can be attached to a"
              echo "version for review."
            else
              echo "Archived and exported without uploading. The signed export is"
              echo "attached to this run as an artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
